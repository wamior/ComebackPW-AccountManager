[package]
name = "comeback_multitool"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "Login"
path = "src/main.rs"

[[bin]]
name = "actives_daemon"
path = "src/bin/actives_daemon.rs"

[dependencies]
eframe = "0.26"
egui = "0.26"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.30"
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
] }
anyhow = "1.0"
parking_lot = "0.12"
base64 = "0.21"
aes = "0.8"
cbc = "0.1"
hex = "0.4"
block-padding = "0.3"
regex = "1.10"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"
lazy_static = "1.4"
image = "0.25.9"
hostname = "0.3"
dirs = "5.0"
indexmap = { version = "2.13.0", features = ["serde"] }
sha2 = "0.10.9"
tungstenite = { version = "0.21", features = ["rustls-tls-webpki-roots"] }
url = "2.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winres = "0.1"
